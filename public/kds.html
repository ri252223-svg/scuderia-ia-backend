<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIKY MENU — Cozinha</title>
<style>
  :root{
    --void: #0A0618;
    --panel: #0B1628;
    --panel-2: #101D33;
    --panel-3: #16223A;
    --line: rgba(245,247,250,0.09);
    --line-2: rgba(245,247,250,0.15);
    --blue: #1677FF;
    --cyan: #4DE0FF;
    --violet: #7C5CFF;
    --ink: #F5F7FA;
    --ink-soft: #8B98AA;
    --ink-faint: #56617A;
    --green: #34D399;
    --red: #F87171;
    --amber: #FBBF24;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--void); color: var(--ink); font-family: var(--font-sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius-lg);
    padding:32px; width:100%; max-width:360px;
  }
  .card h1{ font-size:20px; margin-bottom:4px; }
  .card p{ color: var(--ink-soft); font-size:14px; margin-bottom:20px; }
  label{ display:block; font-size:13px; color: var(--ink-soft); margin:14px 0 6px; }
  input{
    width:100%; padding:11px 13px; background: var(--panel-2); border:1px solid var(--line);
    border-radius: var(--radius-sm); color: var(--ink); font-size:15px; outline:none;
  }
  input:focus{ border-color: var(--blue); }
  button{
    cursor:pointer; border:none; font-family:inherit; font-weight:600;
  }
  .btn-primario{
    width:100%; margin-top:22px; padding:12px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--blue), var(--violet)); color:#fff; font-size:15px;
  }
  .btn-primario:disabled{ opacity:.5; cursor:default; }
  #erro-login{ color: var(--red); font-size:13px; margin-top:12px; min-height:16px; }

  #painel{ display:none; min-height:100vh; padding:18px; }
  header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;
  }
  header h1{ font-size:18px; }
  header h1 span{ color: var(--ink-soft); font-weight:400; font-size:13px; display:block; margin-top:2px;}
  #sair{ background:transparent; color: var(--ink-faint); font-size:13px; text-decoration:underline; }

  .colunas{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; align-items:start; }
  @media (max-width: 900px){ .colunas{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .colunas{ grid-template-columns: 1fr; } }

  .coluna{ background: var(--panel); border:1px solid var(--line); border-radius: var(--radius-lg); padding:12px; min-height:120px; }
  .coluna h2{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color: var(--ink-soft); margin-bottom:10px; display:flex; justify-content:space-between; }
  .coluna h2 .n{ color: var(--ink); background: var(--panel-3); padding:1px 8px; border-radius:20px; font-size:12px; }

  .pedido{
    background: var(--panel-2); border:1px solid var(--line); border-radius: var(--radius-md);
    padding:12px; margin-bottom:10px;
  }
  .pedido .topo{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .pedido .numero{ font-weight:700; font-size:15px; }
  .pedido .mesa{ font-size:12px; color: var(--cyan); }
  .pedido ul{ list-style:none; font-size:13px; color: var(--ink-soft); margin:6px 0; }
  .pedido ul li{ margin-bottom:2px; }
  .pedido ul li b{ color: var(--ink); }
  .pedido .obs{ font-size:12px; color: var(--amber); margin:4px 0; }
  .pedido .total{ font-size:13px; font-weight:600; margin-top:4px; }
  .pedido .acoes{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .pedido .acoes button{
    flex:1; padding:8px 6px; border-radius: var(--radius-sm); font-size:12px; background: var(--panel-3); color: var(--ink);
    border:1px solid var(--line-2);
  }
  .pedido .acoes button.avancar{ background: linear-gradient(135deg, var(--blue), var(--violet)); border:none; color:#fff; }
  .pedido .acoes button.cancelar{ color: var(--red); }
  .vazio{ color: var(--ink-faint); font-size:13px; padding:10px 2px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="card">
    <h1>Painel da cozinha</h1>
    <p>Entre com a conta do seu negócio na SIKY IA.</p>
    <form id="form-login">
      <label>E-mail</label>
      <input type="email" id="login-email" required autocomplete="username">
      <label>Senha</label>
      <input type="password" id="login-senha" required autocomplete="current-password">
      <button type="submit" class="btn-primario" id="btn-login">Entrar</button>
      <div id="erro-login"></div>
    </form>
  </div>
</div>

<div id="painel">
  <header>
    <h1>Painel da cozinha <span id="nome-negocio"></span></h1>
    <button id="sair">sair</button>
  </header>
  <div class="colunas">
    <div class="coluna"><h2>Recebido <span class="n" id="n-recebido">0</span></h2><div id="col-recebido"></div></div>
    <div class="coluna"><h2>Preparando <span class="n" id="n-preparando">0</span></h2><div id="col-preparando"></div></div>
    <div class="coluna"><h2>Pronto <span class="n" id="n-pronto">0</span></h2><div id="col-pronto"></div></div>
    <div class="coluna"><h2>Entregue <span class="n" id="n-entregue">0</span></h2><div id="col-entregue"></div></div>
  </div>
</div>

<script>
const TOKEN_KEY = 'siky_kds_token';
const PROXIMO_STATUS = { recebido: 'preparando', preparando: 'pronto', pronto: 'entregue' };
const ROTULO = { recebido: 'Marcar como preparando', preparando: 'Marcar como pronto', pronto: 'Marcar como entregue' };
let pollTimer = null;

function token(){ return localStorage.getItem(TOKEN_KEY); }

async function api(path, body){
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
    body: JSON.stringify(body || {})
  });
  if (r.status === 401) { sair(); throw new Error('sessão expirada'); }
  return r.json();
}

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const erro = document.getElementById('erro-login');
  erro.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('login-email').value.trim(),
        senha: document.getElementById('login-senha').value
      })
    });
    const data = await r.json();
    if (!data.ok) { erro.textContent = data.mensagem || 'Não foi possível entrar.'; return; }
    localStorage.setItem(TOKEN_KEY, data.token);
    document.getElementById('nome-negocio').textContent = data.business ? '— ' + data.business.nome : '';
    mostrarPainel();
  } catch (e) {
    erro.textContent = 'Erro de conexão. Tente de novo.';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

document.getElementById('sair').addEventListener('click', sair);
function sair(){
  localStorage.removeItem(TOKEN_KEY);
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById('painel').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function mostrarPainel(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  carregarPedidos();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(carregarPedidos, 5000);
}

function elPedido(p){
  const div = document.createElement('div');
  div.className = 'pedido';
  const itens = p.itens.map(i => '<li><b>' + i.quantidade + 'x</b> ' + escapeHtml(i.nome) + (i.observacao ? ' <i>(' + escapeHtml(i.observacao) + ')</i>' : '') + '</li>').join('');
  const proximo = PROXIMO_STATUS[p.status];
  const botoes = [];
  if (proximo) botoes.push('<button class="avancar" data-id="' + p.id + '" data-status="' + proximo + '">' + ROTULO[p.status] + '</button>');
  if (p.status !== 'entregue' && p.status !== 'cancelado') botoes.push('<button class="cancelar" data-id="' + p.id + '" data-status="cancelado">cancelar</button>');
  div.innerHTML =
    '<div class="topo"><span class="numero">#' + p.numero + '</span><span class="mesa">' + escapeHtml(p.mesa_nome) + '</span></div>' +
    '<ul>' + itens + '</ul>' +
    (p.observacao ? '<div class="obs">' + escapeHtml(p.observacao) + '</div>' : '') +
    '<div class="total">R$ ' + p.total.toFixed(2).replace('.', ',') + '</div>' +
    '<div class="acoes">' + botoes.join('') + '</div>';
  div.querySelectorAll('button[data-status]').forEach(btn => {
    btn.addEventListener('click', () => mudarStatus(btn.dataset.id, btn.dataset.status));
  });
  return div;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function mudarStatus(id, status){
  await api('/api/actions/atualizar_status_pedido', { id, status });
  carregarPedidos();
}

async function carregarPedidos(){
  let data;
  try { data = await api('/api/actions/consultar_pedidos', {}); }
  catch (e) { return; }
  if (!data.ok) return;
  const porStatus = { recebido: [], preparando: [], pronto: [], entregue: [] };
  (data.data || []).forEach(p => { if (porStatus[p.status]) porStatus[p.status].push(p); });
  ['recebido', 'preparando', 'pronto', 'entregue'].forEach(st => {
    const col = document.getElementById('col-' + st);
    col.innerHTML = '';
    if (porStatus[st].length === 0) {
      col.innerHTML = '<div class="vazio">Nada por aqui.</div>';
    } else {
      porStatus[st].forEach(p => col.appendChild(elPedido(p)));
    }
    document.getElementById('n-' + st).textContent = porStatus[st].length;
  });
}

if (token()) mostrarPainel();
</script>
</body>
</html>
